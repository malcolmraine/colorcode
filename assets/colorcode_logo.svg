<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Create pie slices for rotational color effect -->
  <g transform="translate(100,100)">
    <!-- 12 segments of 30 degrees each -->
    <path d="M 0,0 L 90,0 A 90,90 0 0,1 77.9,45 L 0,0" fill="#FF0000"/>
    <path d="M 0,0 L 77.9,45 A 90,90 0 0,1 45,77.9 L 0,0" fill="#FF7F00"/>
    <path d="M 0,0 L 45,77.9 A 90,90 0 0,1 0,90 L 0,0" fill="#FFFF00"/>
    <path d="M 0,0 L 0,90 A 90,90 0 0,1 -45,77.9 L 0,0" fill="#00FF00"/>
    <path d="M 0,0 L -45,77.9 A 90,90 0 0,1 -77.9,45 L 0,0" fill="#00FFFF"/>
    <path d="M 0,0 L -77.9,45 A 90,90 0 0,1 -90,0 L 0,0" fill="#0000FF"/>
    <path d="M 0,0 L -90,0 A 90,90 0 0,1 -77.9,-45 L 0,0" fill="#4B0082"/>
    <path d="M 0,0 L -77.9,-45 A 90,90 0 0,1 -45,-77.9 L 0,0" fill="#8B00FF"/>
    <path d="M 0,0 L -45,-77.9 A 90,90 0 0,1 0,-90 L 0,0" fill="#FF00FF"/>
    <path d="M 0,0 L 0,-90 A 90,90 0 0,1 45,-77.9 L 0,0" fill="#FF0077"/>
    <path d="M 0,0 L 45,-77.9 A 90,90 0 0,1 77.9,-45 L 0,0" fill="#FF3300"/>
    <path d="M 0,0 L 77.9,-45 A 90,90 0 0,1 90,0 L 0,0" fill="#FF6600"/>
  </g>

  <!-- Inner white circle for gradient effect -->
  <circle cx="100" cy="100" r="60" fill="white" fill-opacity="0.7"/>

</svg>